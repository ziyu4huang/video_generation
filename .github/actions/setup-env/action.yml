name: Setup Bun workspace
description: |
  The shared job preamble every CI job needs AFTER checkout: setup Bun →
  (optional) setup Node → `bun install --frozen-lockfile` → build the compiled workspace deps whose imports resolve
  gitignored `dist/` outputs (`pi-agent-ext-workflow`'s `dist/index.js`;
  `pi-agent-ext-obsidian`'s `dist/obsidian.bundle.js`, which knowledge-card
  consumes via src/obsidian-lazy.ts to dodge jiti's NameTooLong data-URL wrap
  on the 138 KB obsidian-lib.ts). Centralizes the Bun version + the build-first workspace
  pattern so a rename or version bump touches ONE place, not 5 job definitions.
  Also restores the Bun global install store (~/.bun/install/cache) from cache so
  `bun install --frozen-lockfile` is symlink-only on a hit — this repo uses the
  isolated linker + globalStore, so the store is the source of truth and
  node_modules is just symlinks into it. Cuts runner-minutes across all 22 jobs;
  the install outcome is unchanged (--frozen-lockfile still verifies).

  NOTE: each calling job MUST run `actions/checkout@v4` BEFORE this action — the
  runner reads a local action's action.yml from the workspace, so the repo must
  be checked out first (a composite cannot check out the repo it lives in).

  Node is OPT-IN via `setup-node: true` — only jobs that shell out to `npx tsx`
  need it (the `pi-agent-ext-hermes-memory` matrix entry via `tests/run-all.sh`,
  and the `determinism spot-check` job that runs that same script). Every other
  job is pure Bun and skips the Node setup (~1–2 s + a post-step saved).

inputs:
  setup-node:
    description: Set to "true" to also run actions/setup-node (needed only for tsx-based jobs).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3"

    - name: Setup Node
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Cache Bun install (global store)
      uses: actions/cache@v4
      with:
        # This repo uses the isolated linker + globalStore (see root bunfig.toml),
        # so the global virtual store at ~/.bun/install/cache is the source of
        # truth — node_modules is just symlinks into it. Cache the store so a
        # hit makes `bun install --frozen-lockfile` symlink-only (no re-fetch /
        # re-extract). Keyed on bun.lock for exact hits; restore-keys falls back
        # to a partial (same-OS) hit when deps change.
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install (workspace, frozen lockfile)
      run: bun install --frozen-lockfile
      shell: bash

    # pi-agent-ext-workflow ships TS source; its main/exports point at compiled
    # dist/index.js (gitignored). Importers resolve that dist/ — a fresh CI
    # checkout lacks it (locally it lingers), so build it. ~2.5 s.
    - name: Build pi-agent-ext-workflow (workspace dep)
      run: bun run --cwd bun-apps/pi-agent-ext-workflow build
      shell: bash

    # pi-agent-ext-knowledge-card consumes obsidian via a pre-built FULL bundle
    # (dist/obsidian.bundle.js, gitignored) through src/obsidian-lazy.ts — to
    # dodge jiti's NameTooLong data-URL wrap on the 138 KB obsidian-lib.ts.
    # Anything that loads knowledge-card's extension (knowledge-card itself,
    # pi-agent, pi-agent-cli, extension-contract, the schema-cost CLI, and
    # hermes-memory integration tests) resolves that dist/ — a fresh CI
    # checkout lacks it, so build it. ~0.3 s.
    - name: Build pi-agent-ext-obsidian bundle (workspace dep)
      run: bun run --cwd bun-apps/pi-agent-ext-obsidian build:bundle
      shell: bash
