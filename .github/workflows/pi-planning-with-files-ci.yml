name: CI

# Package-level quality gate for pi-planning-with-files (the guide's §7 Phase 2
# "CI/CD" rung). Mirrors the monorepo root CI's per-package matrix but runs the
# FULL quality chain (biome check → tsc → bun test) so a lint/typecheck
# regression is caught here, not only at the root `test · pi-planning-with-files`
# unit-only check. No npm publish step — this is a local pi-ext by user mandate.
on:
  push:
    branches: [main]
    paths:
      - "bun-apps/pi-planning-with-files/**"
      - ".github/workflows/pi-planning-with-files-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "bun-apps/pi-planning-with-files/**"
      - ".github/workflows/pi-planning-with-files-ci.yml"

concurrency:
  group: piwf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # Workspace install at the repo root resolves the pi-coding-agent peer dep
      # (a workspace:* / latest spec hoisted into the root node_modules).
      - name: Install (workspace)
        run: bun install --frozen-lockfile
      - name: Lint (biome check)
        working-directory: bun-apps/pi-planning-with-files
        run: bun run check
      - name: Typecheck + emit (tsc)
        working-directory: bun-apps/pi-planning-with-files
        run: bun run build
      - name: Unit tests
        working-directory: bun-apps/pi-planning-with-files
        run: bun test
