# CI — the PR gate. Turns the manual-test trust model into an enforced gate.
#
# Every PR to main runs the full Bun test suite (16 packages), the extension
# contract test, the deploy --verify probe, and the regression baselines
# (schema-cost + 2 MB file-size guard). Machine-coupled tests (probing the
# local Apple-Silicon generation stack: python/venv, built swift binaries,
# run.py) skip under CI=true (set automatically by GitHub Actions) — see
# .github/CI.md for what's tested vs. deferred and how to re-run locally.
#
# GPU / Metal / sibling-fork (mflux, ltx-2-mlx) tests are intentionally NOT here:
# GitHub Actions runners lack Apple Silicon. Those stay local-only (documented).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (PR pushed again → kill the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Thrust A — the core test gate. One matrix entry per package → native
  # per-package pass/fail in the PR checks UI (a broken package goes red by
  # name). fail-fast:false so every package reports even if one fails.
  # ──────────────────────────────────────────────────────────────────────────
  tests:
    name: test · ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── uniform `bun test` runner ──
          - { package: pi-agent, test-cmd: "bun test" }
          - { package: pi-agent-cli, test-cmd: "bun test" }
          - { package: pi-agent-ext-flux2, test-cmd: "bun test" }
          - { package: pi-agent-ext-krea2, test-cmd: "bun test" }
          - { package: pi-agent-ext-ltx, test-cmd: "bun test" }
          - { package: pi-agent-ext-movie-director, test-cmd: "bun test" }
          - { package: pi-agent-ext-power-tool, test-cmd: "bun test" }
          - { package: pi-agent-ext-web-access, test-cmd: "bun test" }
          - { package: pi-agent-ext-planning-with-files, test-cmd: "bun test" }
          - { package: pi-agent-sdk-demo, test-cmd: "bun test" }
          - { package: pi-agent-ext-vlm, test-cmd: "bun test" }
          # gui-movie-director: lint is pure static analysis (CI-safe); the
          # check-runtime suite probes run.py via the venv and skips under CI.
          - { package: gui-movie-director, test-cmd: "bun run test" }
          # ── scoped test paths (plain `bun test` discovers vault-needing
          #    files outside extensions/__tests__ in pi-agent-ext-obsidian) ──
          - { package: pi-agent-ext-knowledge-card, test-cmd: "bun test __tests__/" }
          - { package: pi-agent-ext-obsidian, test-cmd: "bun test extensions/__tests__/" }
          # ── special runners (see CLAUDE.md testing section) ──
          # pi-dynamic-workflows: build first (tests import compiled src/*.js);
          # uses the CLAUDE.md canonical `build && bun test`, NOT the package's
          # `npm run check` chain (biome has pre-existing formatting drift — out
          # of scope for the CI cycle; the unit tests + build are the gate).
          - { package: pi-dynamic-workflows, test-cmd: "bun run build && bun test" }
          # pi-agent-ext-hermes-memory: per-file `npx tsx --test` (tests/run-all.sh). Two
          # root-caused reasons tsx (Node) per-file is required (NOT a single
          # `bun test`): (1) bun runs files CONCURRENTLY on a shared thread, and
          # this package's synchronous SQLite (better-sqlite3) starves
          # memory-store's async atomic-write path → intermittent ~900s stall;
          # (2) bun's better-sqlite3 binding fails the corruption-recovery test
          # on ubuntu-latest (recovers rows differently than Node). tsx per-file
          # avoids both (proven #383–#391). Requires Node (setup-node below).
          # See .github/TEST-DETERMINISM.md (D3).
          - { package: pi-agent-ext-hermes-memory, test-cmd: "bash tests/run-all.sh" }

    steps:
      - uses: actions/checkout@v4
      # Shared preamble (Bun + conditional Node + install + build
      # pi-dynamic-workflows). Node is enabled only for the hermes-memory entry
      # (its tests/run-all.sh shells out to `npx tsx` — see D3 in
      # TEST-DETERMINISM.md); every other entry is pure Bun.
      - uses: ./.github/actions/setup-env
        with:
          setup-node: "${{ matrix.package == 'pi-agent-ext-hermes-memory' }}"

      # movie-director's preflight test probes ffmpeg on PATH (the composition
      # runtime). ubuntu-latest doesn't ship it; install only for that matrix
      # entry. (compose.test.ts uses mocked ffmpeg; e2e.local is opt-in.)
      - name: Install ffmpeg (movie-director preflight probe)
        if: matrix.package == 'pi-agent-ext-movie-director'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        working-directory: bun-apps/${{ matrix.package }}
        env:
          # Set automatically by GitHub Actions; the signal machine-coupled
          # tests use to skip (no venv / Metal / swift build on this runner).
          CI: "true"
        run: ${{ matrix.test-cmd }}

  # ──────────────────────────────────────────────────────────────────────────
  # Thrust B — extension contract as a NAMED, visible check (not buried in the
  # pi-agent test run). The 5 tests gate every manifest extension: factory
  # loads, wires up, no tool-name conflicts, valid schema, handler present.
  # ──────────────────────────────────────────────────────────────────────────
  extension-contract:
    name: extension-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Extension contract (5 tests)
        working-directory: bun-apps/pi-agent
        run: bun test src/__tests__/extension-contract.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Thrust B — deploy --verify. Builds pi-agent, bundles the 9 extensions, then
  # boots the deployed artifact from a FOREIGN cwd and probes getAllTools for
  # 0 conflicts. Catches resolve.ts mode bugs + broken bundles at DEPLOY time.
  # Runs on every PR (could be path-gated to pi-agent/extension changes later;
  # always-on is strictly more verification and avoids branch-protection gaps).
  # ──────────────────────────────────────────────────────────────────────────
  deploy-verify:
    name: deploy --verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Deploy + verify (boot deployed artifact, probe getAllTools)
        working-directory: bun-apps/pi-agent
        run: bun scripts/deploy.ts dist/ci-verify --writable --verify

  # ──────────────────────────────────────────────────────────────────────────
  # Thrust C — regression baselines. schema-cost (WARNING at >5%, not a block —
  # schema growth is sometimes intentional) + the 2 MB file-size guard (BLOCK —
  # the remote twin of .githooks/pre-commit, so a bypassed local hook can't ship
  # a large blob) + the test-portability audit (WARN-only v1 — surfaces new
  # ungated machine-coupled tests without blocking; see TEST-PORTABILITY.md).
  # ──────────────────────────────────────────────────────────────────────────
  regression-gates:
    name: regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: File-size guard (2 MB, blocks)
        run: bash scripts/ci-file-size-guard.sh

      # Test-portability prevention check — now BLOCKING (--strict). Scans the
      # test surface for the four "works on my machine" signal patterns and
      # exits non-zero on any UNGATED P1/P2 hit (existsSync of a machine-coupled
      # path; spawn/exec of a host binary). P3/P4 stay review-only. Green across
      # #384–#391 warranted the flip from warn-only; a NEW ungated machine-
      # coupled test now blocks the merge. See .github/TEST-PORTABILITY.md.
      - name: Test-portability audit (--strict, blocks)
        run: bash scripts/test-portability-audit.sh --strict

      # Test-determinism prevention check (warn-only v1). The cross-RUN twin of
      # the portability audit: scans for the four flake classes (uncontrolled
      # time; real host-state writes; cross-file ordering; live network) and
      # classifies each file CONTROLLED / UNCONTROLLED. D2 (real-host-state
      # writes) blocks under --strict; D1/D4 are review-only (a Date.now() is
      # often a benign seed; a URL string isn't a live call). Flip D2 to --strict
      # once trusted — same discipline as the portability flip above. See
      # .github/TEST-DETERMINISM.md for the full catalog + dispositions.
      - name: Test-determinism audit (warn-only v1)
        run: bash scripts/test-determinism-audit.sh

      - name: Schema-cost regression (warns >5%, not a block)
        run: bun scripts/check-schema-cost.ts

  # ──────────────────────────────────────────────────────────────────────
  # Thrust C — determinism spot-check (cross-RUN flake detector). Runs the
  # flake-prone subset (pi-agent-ext-hermes-memory, pi-dynamic-workflows, pi-agent-ext-obsidian)
  # 3× in sequence and flags any differing pass/fail outcome as a flake. v1 is
  # INFORMATIONAL (continue-on-error) until the false-positive rate is ≈ 0; flip
  # to blocking once trusted — same rollout discipline as the portability audit.
  # The structural audit (test-determinism-audit.sh) is the proof; this is the
  # detection backstop. See .github/TEST-DETERMINISM.md.
  # ──────────────────────────────────────────────────────────────────────
  determinism-spotcheck:
    name: determinism spot-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Node IS needed here: the spot-check runs pi-agent-ext-hermes-memory's
      # tests/run-all.sh, which shells out to `npx tsx`.
      - uses: ./.github/actions/setup-env
        with:
          setup-node: "true"
      - name: Determinism spot-check (3× flake-prone subset)
        run: bash scripts/test-determinism-spotcheck.sh
